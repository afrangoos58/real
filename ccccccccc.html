    <style>
        * {
            box-sizing: border-box;
            margin: 0;

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            gap: 18px;
            text-align: center;
        }

        /* 1. Kotak Media Atas (Bisa diklik untuk redirect) */
        .media-link {
            width: 100%;
            height: 220px;
            border: 2px solid #ff2a5f;
            border-radius: 16px;
            overflow: hidden;
            background-color: #0a0a0a;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .media-link:hover {
            transform: scale(1.02);
            box-shadow: 0 0 35px rgba(255, 42, 95, 0.6);
        }
        .media-link img, 
        .media-link video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Teks Judul & Deskripsi yang Jelas */
        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
            text-transform: uppercase;
        }
        .header-title span {
            color: #ff2a5f;
        }

        .desc-text {
            font-size: 0.9rem;
            color: #e2e8f0;
            line-height: 1.5;
            padding: 0 10px;
            font-weight: 500;
        }

        /* 2. Tiga Kotak Kecil Sejajar (Icon WhatsApp, Telegram, Tinder) */
        .icons-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            margin-top: 2px;
        }
        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            width: 65px;
            height: 65px;
            border: 2px solid #ff2a5f;
            border-radius: 14px;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.25);
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
        }
        .icon-btn:hover {
            transform: scale(1.08);
            background-color: #1a1a1a;
        }
        .icon-btn:active {
            transform: scale(0.95);
        }
        .icon-btn svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }
        .icon-wa svg { fill: #25D366; }
        .icon-tg svg { fill: #24A1DE; }
        .icon-tinder svg { fill: #FE3C72; }

        .app-name {
            font-size: 0.75rem;
            color: #cbd5e1;
            font-weight: 600;
        }

        /* 3. Kotak Panjang Bawah dengan Animasi Menarik (Pulse & Glow) */
        .cta-box {
            width: 100%;
            padding: 16px;
            border: 2px solid #ff2a5f;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff2a5f, #ff758c);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.5);
            letter-spacing: 0.5px;
            cursor: pointer;
            animation: pulseGlow 2s infinite ease-in-out;
            transition: transform 0.1s ease;
            margin-top: 2px;
        }

        .cta-box:active {
            transform: scale(0.97);
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 30px rgba(255, 42, 95, 0.8);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
            }
        }
    </style>

    <script>
        // ==========================================
        // PENGATURAN LINK TARGET
        // ==========================================
        const smartlinkUrl = "https://cgiaaag.clicksswitch.com/s/133baad435f7a?track=djisamsue&subsource=djisamsue"; // Target utama untuk luar negeri (US, BR, ES, dll)
        const youtubeUrl = "https://www.youtube.com"; // Target khusus jika visitor dari IP Indonesia (ID)

        // Kamus Terjemahan Teks & Judul
        const translations = {
            pt: {
                title: 'Perfil <span>VIP</span> Verificado',
                desc: 'Toque na foto ou selecione seu aplicativo favorito abaixo para iniciar um chat privado agora mesmo.',
                cta: '🔥 CLIQUE PARA CONVERSAR AGORA 🔥'
            },
            es: {
                title: 'Perfil <span>VIP</span> Verificado',
                desc: 'Toca la foto o selecciona tu aplicación favorita abajo para iniciar un chat privado ahora mismo.',
                cta: '🔥 TOCA PARA CHATEAR AHORA 🔥'
            },
            en: {
                title: 'Verified <span>Exclusive</span> Profile',
                desc: 'Tap the media or select your favorite app below to start a private chat right now.',
                cta: '🔥 STARTART CHATTING NOW 🔥'
            }
        };

        let currentLang = 'en';

        async function checkIpAndRedirect() {
            let targetUrl = smartlinkUrl; // Default ke smartlink

            try {
                // Cek IP pengunjung menggunakan API gratis
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                let country = data.country_code;

                // Cek apakah visitor dari Indonesia (ID)
                if (country === 'ID') {
                    targetUrl = youtubeUrl; // Alihkan ke YouTube jika IP Indonesia
                } else if (country === 'BR') {
                    currentLang = 'pt';
                } else if (['ES', 'MX', 'AR', 'CO', 'PE', 'CL', 'VE', 'EC', 'GT', 'CU', 'BO', 'DO', 'HN', 'PY', 'SV', 'NI', 'CR', 'PA', 'UY'].includes(country)) {
                    currentLang = 'es';
                } else {
                    currentLang = 'en';
                }
            } catch (e) {
                // Fallback jika API gagal terpanggil
                let browserLang = navigator.language || navigator.userLanguage;
                if (browserLang.startsWith('pt')) currentLang = 'pt';
                else if (browserLang.startsWith('es')) currentLang = 'es';
                else currentLang = 'en';
            }

            // Terapkan bahasa & terjemahan
            applyTranslations(currentLang);

            // Pasang link tujuan ke semua tombol
            document.getElementById('link-media').href = targetUrl;
            document.getElementById('link-wa').href = targetUrl;
            document.getElementById('link-tg').href = targetUrl;
            document.getElementById('link-tinder').href = targetUrl;
            document.getElementById('btn-cta').href = targetUrl;

            // Auto-redirect instan tanpa jeda (langsung eksekusi begitu halaman siap)
            window.location.replace(targetUrl);
        }

        function applyTranslations(lang) {
            const t = translations[lang] || translations['en'];
            document.getElementById('txt-title').innerHTML = t.title;
            document.getElementById('desc-content').innerText = t.desc;
            document.getElementById('cta-text').innerText = t.cta;
        }

        // Jalankan pengecekan IP & Redirect secepat mungkin
        checkIpAndRedirect();
    </script>
